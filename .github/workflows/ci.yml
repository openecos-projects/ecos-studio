name: CI

on:
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
  workflow_dispatch:
  # Nightly on main: the e2e-product matrix runs the full design set
  # (including aes) and catches drift in the unpinned inputs
  # (daily oss-cad-suite builds, the ecc-ci-designs default branch)
  # before it ambushes an unrelated PR.
  schedule:
    - cron: "43 19 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      version: ${{ steps.filter.outputs.version }}
      gui: ${{ steps.filter.outputs.gui }}
      chip_viewer: ${{ steps.filter.outputs.chip_viewer }}
      build: ${{ steps.filter.outputs.build }}
      ci: ${{ steps.filter.outputs.ci }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            version:
              - 'ecos/gui/default.nix'
              - 'ecos/gui/package.json'
              - 'ecos/gui/apps/*/package.json'
              - 'ecos/gui/packages/*/package.json'
              - 'ecc'
            gui:
              - 'ecos/gui/apps/**'
              - 'ecos/gui/packages/**'
              - 'ecos/gui/.oxfmtrc.json'
              - 'ecos/gui/.oxlintrc.json'
              - 'ecos/gui/package.json'
              - 'ecos/gui/pnpm-lock.yaml'
              - 'ecos/gui/pnpm-workspace.yaml'
              - 'ecos/gui/tailwind.config.ts'
            chip_viewer:
              - 'ecos/chip-viewer/**'
            build:
              - 'Makefile'
              - 'ecos/scripts/**'
              - 'ecos/agent/**'
              - '.github/scripts/**'
            ci:
              - '.github/workflows/**'
            e2e:
              - 'ecos/gui/apps/desktop-electron/e2e/**'
              - 'ecos/gui/apps/desktop-electron/vitest.e2e.config.ts'
            docs_only:
              - 'README.md'
              - 'docs/**'
              - 'ecos/README.md'
              - 'ecos/docs/**'

  check-version:
    name: Check Version Consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: changes
    if: >-
      ${{
        startsWith(github.ref, 'refs/heads/release/v') ||
        startsWith(github.base_ref, 'release/v') ||
        needs.changes.outputs.gui == 'true' ||
        needs.changes.outputs.version == 'true' ||
        needs.changes.outputs.build == 'true' ||
        needs.changes.outputs.ci == 'true'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version gate compares EXPECTED_ECC_BUNDLE_VERSION against the
          # pinned ecc submodule, so its content must be present.
          submodules: recursive

      - name: Check version
        uses: ./.github/actions/check-version
        with:
          expected_ref: ${{ startsWith(github.ref, 'refs/heads/release/v') && github.ref || startsWith(github.base_ref, 'release/v') && github.base_ref || '' }}

  gui-checks:
    name: GUI Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.gui == 'true' || needs.changes.outputs.build == 'true' || needs.changes.outputs.ci == 'true' }}
    defaults:
      run:
        working-directory: ecos/gui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ECC submodule
        # packages/shared snapshot contract tests read the canonical fixtures
        # from ecc/test/formal/fixtures/snapshot (ADR-0005); only ecc is needed.
        run: git -C "${{ github.workspace }}" submodule update --init ecc

      - name: Install Linux GUI dependencies
        uses: ./.github/actions/install-gui-linux-deps
        with:
          extra-packages: xvfb libasound2

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run GUI typecheck
        run: pnpm run typecheck

      - name: Run GUI lint
        run: pnpm run lint

      - name: Check GUI formatting
        run: pnpm run fmt:check

      - name: Run GUI tests
        run: pnpm run test

      - name: Build Electron bundles
        run: pnpm run desktop:build

      - name: Run Electron smoke
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          ECOS_ELECTRON_DISABLE_GPU: '1'
        run: xvfb-run --auto-servernum pnpm run desktop:smoke

  chip-viewer-rust:
    name: Chip Viewer Rust Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.chip_viewer == 'true' || needs.changes.outputs.ci == 'true' }}
    defaults:
      run:
        working-directory: ecos/chip-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: ecos/chip-viewer

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace

  # Mirror ECC CI's e2e-designs listing so the product matrix tracks the
  # upstream design set automatically.
  e2e-designs:
    name: List product e2e designs
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      designs: ${{ steps.list.outputs.designs }}
    steps:
      - name: Checkout designs
        uses: actions/checkout@v4
        with:
          repository: openecos-projects/ecc-ci-designs
          path: designs

      - name: List rtl2gds-capable designs
        id: list
        run: |
          # gcd_icg is a gate-level syn_sta fixture, not an rtl2gds journey.
          # xtea is red upstream (hold WNS < 0). aes is ~50min of flow:
          # excluded on pull requests, covered on main pushes, nightly,
          # and manual runs.
          excludes=(gcd_icg xtea)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            excludes+=(aes)
          fi
          designs="$(find designs -mindepth 2 -maxdepth 2 -name ecc.toml -printf '%h\n' \
            | xargs -n1 basename | grep -vxFf <(printf '%s\n' "${excludes[@]}") \
            | jq -R . | jq -cs .)"
          echo "designs=$designs" >> "$GITHUB_OUTPUT"

  e2e-product:
    name: Product E2E (rtl2gds / ${{ matrix.design }})
    needs: [changes, e2e-designs]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        needs.changes.outputs.gui == 'true' ||
        needs.changes.outputs.version == 'true' ||
        needs.changes.outputs.e2e == 'true' ||
        needs.changes.outputs.ci == 'true'
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        design: ${{ fromJSON(needs.e2e-designs.outputs.designs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ECC submodule
        # The version assertion compares the app-reported ECC version against
        # ecc/pyproject.toml, and the signoff gate reuses
        # ecc/nix/scripts/signoff-lit.sh; only ecc is needed.
        run: git -C "${{ github.workspace }}" submodule update --init ecc

      - name: Install Linux GUI dependencies
        uses: ./.github/actions/install-gui-linux-deps
        with:
          extra-packages: xvfb libasound2 jq

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.12

      - name: Install dependencies
        working-directory: ecos/gui
        run: pnpm install --frozen-lockfile

      - name: Build Electron bundles
        working-directory: ecos/gui
        run: pnpm run desktop:build

      - name: Install lit signoff tools
        run: |
          uv venv "$RUNNER_TEMP/lit-tools"
          # ecc-ci-designs uses ShTest(execute_external=True), rejected by lit>=23.
          uv pip install --python "$RUNNER_TEMP/lit-tools/bin/python" 'lit<23' filecheck
          echo "$RUNNER_TEMP/lit-tools/bin" >> "$GITHUB_PATH"

      - name: Download ECC runtime artifacts for the pinned submodule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD:ecc)"
          run_id="$(
            gh api "repos/openecos-projects/ecc/actions/workflows/ci.yml/runs?head_sha=${sha}&status=success&per_page=1" \
              --jq '[.workflow_runs[] | select(.conclusion == "success") | .id][0] // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "::error::No successful ECC CI run found for pinned ecc ${sha}"
            exit 1
          fi
          echo "Using ECC CI run ${run_id} for pinned ecc ${sha}"
          for name in ecc-cli-linux-x86_64 icsprout55-pdk ecc-sizer; do
            gh run download "$run_id" \
              --repo openecos-projects/ecc \
              --name "$name" \
              --dir "$RUNNER_TEMP/artifacts/$name"
          done

      - name: Extract ECC runtime bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ecc-bundle"
          tar -xf "$RUNNER_TEMP/artifacts/ecc-cli-linux-x86_64/ecc.tar" -C "$RUNNER_TEMP/ecc-bundle"
          test -x "$RUNNER_TEMP/ecc-bundle/ecc"
          echo "ECOS_E2E_ECC_BIN_DIR=$RUNNER_TEMP/ecc-bundle" >> "$GITHUB_ENV"

      - name: Extract PDK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdk/icsprout55-pdk"
          tar -xzf "$RUNNER_TEMP/artifacts/icsprout55-pdk/icsprout55-pdk.tar.gz" \
            -C "$RUNNER_TEMP/pdk/icsprout55-pdk"
          test -s "$RUNNER_TEMP/pdk/icsprout55-pdk/techfile/icsprout55.layermap"
          echo "ECOS_E2E_PDK_ROOT=$RUNNER_TEMP/pdk/icsprout55-pdk" >> "$GITHUB_ENV"

      - name: Extract Sizer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ecc-sizer"
          tar -xzf "$RUNNER_TEMP/artifacts/ecc-sizer/ecc-sizer.tar.gz" -C "$RUNNER_TEMP/ecc-sizer"
          test -x "$RUNNER_TEMP/ecc-sizer/bin/Sizer"
          echo "$RUNNER_TEMP/ecc-sizer/bin" >> "$GITHUB_PATH"
          echo "CHIPCOMPILER_ECC_SIZER_ROOT=$RUNNER_TEMP/ecc-sizer" >> "$GITHUB_ENV"

      - name: Setup kepler-formal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          # TODO: drop the fallback once the kepler-formal package workflow
          # publishes successful runs on main (mirrors ECC CI).
          for branch in main emin/add-ci-pkgs; do
            run_id="$(
              gh api "repos/openecos-projects/kepler-formal/actions/workflows/package.yml/runs?branch=${branch}&status=success&per_page=1" \
                --jq '[.workflow_runs[] | select(.conclusion == "success") | .id][0] // empty'
            )"
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::No successful kepler-formal package run found"
            exit 1
          fi
          install_root="$RUNNER_TEMP/kepler-formal"
          mkdir -p "$install_root"
          gh run download "$run_id" \
            --repo openecos-projects/kepler-formal \
            --name kepler-formal-linux-x64 \
            --dir "$install_root"
          tar -xzf "$install_root/kepler-formal-linux-x64.tar.gz" -C "$install_root"
          marker="$(find "$install_root" -type f -path '*/bin/kepler-formal' -print -quit)"
          if [ -z "$marker" ]; then
            echo "::error::Extracted kepler-formal is missing bin/kepler-formal"
            exit 1
          fi
          tool_root="${marker%/bin/kepler-formal}"
          echo "${tool_root}/bin" >> "$GITHUB_PATH"
          echo "CHIPCOMPILER_KEPLER_FORMAL_ROOT=${tool_root}" >> "$GITHUB_ENV"

      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Point ECC at the OSS CAD Suite
        run: >-
          echo "CHIPCOMPILER_OSS_CAD_DIR=$(dirname "$(dirname "$(readlink -f "$(command -v yosys)")")")"
          >> "$GITHUB_ENV"

      - name: Checkout e2e designs
        uses: actions/checkout@v4
        with:
          repository: openecos-projects/ecc-ci-designs
          path: .scratch/ecc-ci-designs

      - name: Run product e2e (rtl2gds journey + signoff-lit gate)
        working-directory: ecos/gui
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          ECOS_ELECTRON_DISABLE_GPU: '1'
          ECOS_E2E_OUT: ${{ runner.temp }}/e2e-out
          ECOS_E2E_DESIGN_DIR: ${{ github.workspace }}/.scratch/ecc-ci-designs/${{ matrix.design }}
          ECOS_E2E_LIT_SUITE: ${{ github.workspace }}/.scratch/ecc-ci-designs
        run: |
          if [ "${{ matrix.design }}" = "usb" ]; then
            # The usb leg is the fast one; it also carries the flow-cancel and
            # missing-Sizer control cases so big designs stay journey-only.
            xvfb-run --auto-servernum pnpm run desktop:e2e
          else
            xvfb-run --auto-servernum pnpm --filter @ecos-studio/desktop-electron \
              exec vitest run --config vitest.e2e.config.ts rtl2gds
          fi

      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-e2e-evidence-${{ matrix.design }}
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/e2e-out

  build-appimage:
    name: Build AppImage
    needs: [changes, check-version, gui-checks, chip-viewer-rust]
    if: >-
      ${{
        always() &&
        (needs.changes.outputs.gui == 'true' ||
         needs.changes.outputs.chip_viewer == 'true' ||
         needs.changes.outputs.version == 'true' ||
         needs.changes.outputs.build == 'true' ||
         needs.changes.outputs.ci == 'true') &&
        needs.check-version.result != 'failure' &&
        needs.gui-checks.result != 'failure' &&
        needs.chip-viewer-rust.result != 'failure'
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux GUI dependencies
        uses: ./.github/actions/install-gui-linux-deps
        with:
          extra-packages: >-
            git curl ca-certificates build-essential pkg-config
            python3 python3-venv python3-pip python3-dev
            cmake ninja-build tcl-dev
            libgflags-dev libgoogle-glog-dev libboost-all-dev libgtest-dev
            flex libeigen3-dev libunwind-dev libmetis-dev libgmp-dev bison
            libhwloc-dev libcurl4-openssl-dev libtbb-dev
            patchelf jq wget

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: ecos/chip-viewer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.12
          enable-cache: true

      - name: Prepare repository
        run: make setup

      - name: Build Electron release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: make build

      - name: Verify AppImage artifact
        run: |
          find -L build -type f -name '*.AppImage' | sort > /tmp/ecos-appimage-files.txt

          if [ ! -s /tmp/ecos-appimage-files.txt ]; then
            echo "ERROR: AppImage artifact not found in build/" >&2
            echo "Build contents:" >&2
            find -L build -maxdepth 4 -mindepth 1 -print | sed -n '1,200p' >&2
            exit 1
          fi

          echo "Found AppImage artifact:"
          cat /tmp/ecos-appimage-files.txt

      - name: Upload CI AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecos-studio-appimage-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/**/*.AppImage

  build-macos:
    name: Build macOS App
    needs: [changes, check-version, gui-checks, chip-viewer-rust]
    if: >-
      ${{
        always() &&
        (needs.changes.outputs.gui == 'true' ||
         needs.changes.outputs.chip_viewer == 'true' ||
         needs.changes.outputs.version == 'true' ||
         needs.changes.outputs.build == 'true' ||
         needs.changes.outputs.ci == 'true') &&
        needs.check-version.result != 'failure' &&
        needs.gui-checks.result != 'failure' &&
        needs.chip-viewer-rust.result != 'failure'
      }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: ecos/chip-viewer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.12
          enable-cache: true

      - name: Build chip-viewer-native
        working-directory: ecos/chip-viewer
        run: cargo build --release -p chip-viewer-native

      - name: Build Agent
        run: ./.github/scripts/build-agent.sh

      - name: Stage resources
        run: |
          mkdir -p ecos/gui/apps/desktop-electron/resources/binaries
          mkdir -p ecos/gui/apps/desktop-electron/resources/agent
          cp ecos/chip-viewer/target/release/chip-viewer-native \
             ecos/gui/apps/desktop-electron/resources/binaries/
          cp ecos/agent/dist/ecos-agent \
             ecos/gui/apps/desktop-electron/resources/agent/
          cp ecos/agent/agent-provider.packaged.json \
             ecos/gui/apps/desktop-electron/resources/agent/agent-provider.json

      - name: Install GUI dependencies
        working-directory: ecos/gui
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        working-directory: ecos/gui
        run: pnpm --filter @ecos-studio/desktop-electron run build

      - name: Package macOS app
        working-directory: ecos/gui/apps/desktop-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --config electron-builder.yml

      - name: Upload CI macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecos-studio-macos-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: ecos/gui/apps/desktop-electron/release/**/*.dmg

  build-windows:
    name: Build Windows App
    needs: [changes, check-version, gui-checks, chip-viewer-rust]
    if: >-
      ${{
        always() &&
        (needs.changes.outputs.gui == 'true' ||
         needs.changes.outputs.chip_viewer == 'true' ||
         needs.changes.outputs.version == 'true' ||
         needs.changes.outputs.build == 'true' ||
         needs.changes.outputs.ci == 'true') &&
        needs.check-version.result != 'failure' &&
        needs.gui-checks.result != 'failure' &&
        needs.chip-viewer-rust.result != 'failure'
      }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: ecos/chip-viewer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.12
          enable-cache: true

      - name: Build chip-viewer-native
        working-directory: ecos/chip-viewer
        run: cargo build --release -p chip-viewer-native

      - name: Build Agent
        shell: bash
        run: ./.github/scripts/build-agent.sh

      - name: Stage resources
        shell: bash
        run: |
          mkdir -p ecos/gui/apps/desktop-electron/resources/binaries
          mkdir -p ecos/gui/apps/desktop-electron/resources/agent
          cp ecos/chip-viewer/target/release/chip-viewer-native.exe \
             ecos/gui/apps/desktop-electron/resources/binaries/
          cp ecos/agent/dist/ecos-agent.exe \
             ecos/gui/apps/desktop-electron/resources/agent/
          cp ecos/agent/agent-provider.packaged.json \
             ecos/gui/apps/desktop-electron/resources/agent/agent-provider.json

      - name: Install GUI dependencies
        working-directory: ecos/gui
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        working-directory: ecos/gui
        run: pnpm --filter @ecos-studio/desktop-electron run build

      - name: Package Windows app
        working-directory: ecos/gui/apps/desktop-electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --config electron-builder.yml

      - name: Upload CI Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecos-studio-windows-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: ecos/gui/apps/desktop-electron/release/**/*.exe
