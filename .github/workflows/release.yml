name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to release (for example, v0.1.0-alpha.6)
        required: true

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version Consistency
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Check version
        id: version
        uses: ./.github/actions/check-version
        with:
          expected_tag: ${{ github.event.inputs.tag_name || github.ref_name }}

  build:
    name: Build Linux AppImage
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux GUI dependencies
        uses: ./.github/actions/install-gui-linux-deps
        with:
          extra-packages: >-
            git curl ca-certificates build-essential pkg-config
            python3 python3-venv python3-pip python3-dev
            cmake ninja-build tcl-dev
            libgflags-dev libgoogle-glog-dev libboost-all-dev libgtest-dev
            flex libeigen3-dev libunwind-dev libmetis-dev libgmp-dev bison
            libhwloc-dev libcurl4-openssl-dev libtbb-dev
            patchelf jq wget

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: ecos/chip-viewer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.12
          enable-cache: true

      - name: Prepare repository
        run: make setup

      - name: Build Electron release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: make build

      - name: Verify AppImage artifact
        run: |
          find -L build -type f -name '*.AppImage' | sort > /tmp/ecos-release-files.txt
          if [ ! -s /tmp/ecos-release-files.txt ]; then
            echo "ERROR: AppImage artifact not found in build/" >&2
            echo "Build contents:" >&2
            find -L build -maxdepth 4 -mindepth 1 -print | sed -n '1,200p' >&2
            exit 1
          fi

          echo "Built AppImage artifact:"
          cat /tmp/ecos-release-files.txt

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecos-studio-release-linux
          if-no-files-found: error
          path: |
            build/**/*.AppImage

  build-macos:
    name: Build macOS App
    needs: check-version
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: ecos/chip-viewer

      - name: Build chip-viewer-native
        working-directory: ecos/chip-viewer
        run: cargo build --release -p chip-viewer-native

      - name: Stage resources
        run: |
          mkdir -p ecos/gui/apps/desktop-electron/resources/binaries
          mkdir -p ecos/gui/apps/desktop-electron/resources/agent
          cp ecos/chip-viewer/target/release/chip-viewer-native \
             ecos/gui/apps/desktop-electron/resources/binaries/

      - name: Install GUI dependencies
        working-directory: ecos/gui
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        working-directory: ecos/gui
        run: pnpm --filter @ecos-studio/desktop-electron run build

      - name: Package macOS app
        working-directory: ecos/gui/apps/desktop-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --config electron-builder.yml

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecos-studio-release-macos
          if-no-files-found: error
          path: ecos/gui/apps/desktop-electron/release/**/*.dmg

  build-windows:
    name: Build Windows App
    needs: check-version
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: ecos/chip-viewer

      - name: Build chip-viewer-native
        working-directory: ecos/chip-viewer
        run: cargo build --release -p chip-viewer-native

      - name: Stage resources
        shell: bash
        run: |
          mkdir -p ecos/gui/apps/desktop-electron/resources/binaries
          mkdir -p ecos/gui/apps/desktop-electron/resources/agent
          cp ecos/chip-viewer/target/release/chip-viewer-native.exe \
             ecos/gui/apps/desktop-electron/resources/binaries/

      - name: Install GUI dependencies
        working-directory: ecos/gui
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        working-directory: ecos/gui
        run: pnpm --filter @ecos-studio/desktop-electron run build

      - name: Package Windows app
        working-directory: ecos/gui/apps/desktop-electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --config electron-builder.yml

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecos-studio-release-windows
          if-no-files-found: error
          path: ecos/gui/apps/desktop-electron/release/**/*.exe

  release:
    name: Create Release
    needs: [check-version, build, build-macos, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ecos-studio-release-*
          path: build/release
          merge-multiple: true

      - name: Determine tag version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FULL_TAG="${{ github.event.inputs.tag_name }}"
          else
            FULL_TAG="${GITHUB_REF_NAME}"
          fi
          TAG_VERSION="${FULL_TAG#v}"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "full_tag=$FULL_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --output release-changelog.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes
        run: |
          {
            echo "> [!WARNING]"
            echo "> **ECOS Studio** is still under rapid development. The EDA flow (Yosys, ECC-Tools, KLayout) runs on **Linux x86_64** only. macOS and Windows builds include the GUI and chip viewer; EDA tool execution is not yet supported on those platforms."
            echo ">"
            echo ""
            cat release-changelog.md
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t ASSETS < <(find build/release -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \) | sort)
          gh release create "${{ steps.version.outputs.full_tag }}" \
            --title "ECOS Studio ${{ steps.version.outputs.full_tag }}" \
            --notes-file release-notes.md \
            "${ASSETS[@]}"
