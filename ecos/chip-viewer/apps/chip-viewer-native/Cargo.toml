[package]
name = "chip-viewer-native"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
render-pixel-tests = []

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
chip-display = { path = "../../crates/chip-display" }
chip-render = { path = "../../crates/chip-render" }
chip-view-db = { path = "../../crates/chip-view-db" }
chipgeom-reader = { path = "../../crates/chipgeom-reader" }
chipgeom-format = { path = "../../crates/chipgeom-format" }
clap.workspace = true
csv.workspace = true
eframe = { workspace = true, features = ["wgpu", "glow"] }
egui.workspace = true
egui-wgpu.workspace = true
image.workspace = true
log = "0.4"
pollster = "0.4"
rstar.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true
sha2 = "0.10"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
glutin = { version = "0.32.3", default-features = false, features = ["egl"] }

[dev-dependencies]
winit = "0.30"
