appId: org.openecos.ecos-studio
productName: ECOS Studio
afterPack: ./scripts/after-pack-linux-sandbox.mjs
directories:
  output: release
# Disable electron-builder's implicit CI/token publishing.
publish: null
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/binaries
    to: binaries
  - from: resources/agent
    to: agent
  - from: ../../../../ecc/docs/examples/gcd/gcd.v
    to: agent/quick-start/gcd.v
linux:
  artifactName: ECOS-Studio_${version}_${arch}.${ext}
  executableName: ecos-studio
  category: Development
  maintainer: OpenECOS Team <openecos-projects@users.noreply.github.com>
  target:
    - AppImage
    - deb

mac:
  artifactName: ECOS-Studio_${version}_${arch}.${ext}
  executableName: ecos-studio
  category: public.app-category.developer-tools
  target:
    - dmg

win:
  artifactName: ECOS-Studio_${version}_${arch}.${ext}
  target:
    - nsis
